name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (typecheck)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Production server smoke test
        env:
          GEMINI_API_KEY: dummy-key-for-smoke-test
          NODE_ENV: production
        run: |
          set -e
          node dist/server.cjs &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000/; then break; fi
            if [ "$i" -eq 30 ]; then echo "Server never came up"; exit 1; fi
            sleep 1
          done

          check() {
            local description="$1" expected="$2" actual="$3"
            if [ "$actual" != "$expected" ]; then
              echo "FAIL: $description - expected $expected, got $actual"
              exit 1
            fi
            echo "OK: $description ($actual)"
          }

          check "homepage" 200 "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)"

          # Regression check for the Express 5 path-to-regexp wildcard break:
          # a bare app.get("*", ...) throws at route-registration time and
          # this route only exists in the production build.
          check "deep unmatched route (SPA fallback)" 200 \
            "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/some/deep/unmatched/route)"

          # Regression check for the req.body-undefined crash: an invalid
          # request must get a clean 400, not a 500 with a leaked stack trace.
          check "invalid POST /api/analyze" 400 \
            "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/analyze)"
